name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-compile:
    name: Syntax & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps for psycopg2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q app alembic tasks scripts

      - name: Import smoke test
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
          SYNC_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_SSL: "false"
        run: python -c "import app.main; import app.database; import app.models; print('imports ok')"

  # 注:原 "Alembic upgrade head" job 已移除。
  # 该仓库的表由 Base.metadata.create_all 建（见 create_tables.py），迁移只做增量，
  # 没有"从空库建全表"的基线迁移；因此 `alembic upgrade head` 在 CI 的空库上第一个
  # 迁移(001 给 projects 加列)就会报 "relation projects does not exist"，从加上起每次
  # 必红、且从未提供有效信号，也不阻塞部署(brank-cicd 是另一个 workflow)。故删除。
  # 若将来想恢复迁移校验：先补一个建全表的基线迁移，再加回该 job。

  tests:
    name: pytest (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests (skip if empty)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
          SYNC_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_SSL: "false"
        run: |
          if find tests -name "test_*.py" -o -name "*_test.py" 2>/dev/null | grep -q .; then
            pytest -q
          else
            echo "No test files yet — skipping. Add tests under tests/ to enable this job."
          fi
