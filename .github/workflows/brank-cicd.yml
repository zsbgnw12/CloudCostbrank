name: brank-cicd

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_NAME: cloudcostacr20260409
  ACR_LOGIN_SERVER: cloudcostacr20260409.azurecr.io
  IMAGE_REPO: cloudcost
  CONTAINER_APP: cloudcost-brank
  RESOURCE_GROUP: CloudCost

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Compute image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_REPO}:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Treat command / env / probes / resources / image as one atomic config that lives in
      # `scripts/aca_apply_multicontainer.py`. Every push regenerates the full YAML from
      # the script and applies it via `az containerapp update --yaml`. This guarantees:
      #   - api 容器 command 永远是「python -m alembic upgrade head && uvicorn」(自动跑迁移)
      #   - worker / beat 永远是各自的 celery 命令
      #   - 任何配置漂移（手动 Portal 改、误改 revision）会在下一次 push 时被复位
      #   - 配置变更进 git，可 diff、可 review、可回滚
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML for ACA patch script
        run: pip install -r scripts/requirements-aca.txt

      - name: Apply full Container App config (image + command + probes)
        run: |
          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            -o json \
            | python scripts/aca_apply_multicontainer.py --image "$IMAGE" \
            > /tmp/aca-patch.yaml
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --yaml /tmp/aca-patch.yaml
