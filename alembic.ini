[alembic]
script_location = alembic
# 把项目根("." = cwd)加进 sys.path，否则 env.py 里 `from app.database import Base` 找不到 app 包。
# 不加这行会让 `alembic upgrade head` 在 console script 形式下挂掉(uvicorn 不影响)。
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://azuredb:h13nYoFJX6QrfLzB8bdipEUCjsZq2P7W@dataope.postgres.database.azure.com:5432/cloudcost

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
